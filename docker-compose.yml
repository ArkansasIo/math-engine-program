services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: axiomforge
      POSTGRES_USER: axiomforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports: ["5432:5432"]
    volumes: ["axiomforge-db:/var/lib/postgresql/data", "./server/migrations:/docker-entrypoint-initdb.d:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axiomforge -d axiomforge"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./server
    environment:
      NODE_ENV: development
      PORT: 8080
      DATABASE_URL: postgres://axiomforge:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/axiomforge
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deploy-000000}
      JWT_ISSUER: axiomforge
      CORS_ORIGIN: http://localhost:3000
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  axiomforge-db:
