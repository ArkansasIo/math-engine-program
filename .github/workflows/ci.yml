name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Validate release metadata
        run: python3 scripts/validate_release.py
      - name: Validate project manifest
        run: python3 scripts/check_manifest.py
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: axiomforge
          POSTGRES_USER: axiomforge
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axiomforge -d axiomforge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Apply schema migrations to PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -U axiomforge -d axiomforge -v ON_ERROR_STOP=1 -f migrations/001_initial.sql
          psql -h localhost -U axiomforge -d axiomforge -v ON_ERROR_STOP=1 -f migrations/002_realtime_and_releases.sql
          psql -h localhost -U axiomforge -d axiomforge -v ON_ERROR_STOP=1 -f migrations/003_query_and_audit_indexes.sql
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
